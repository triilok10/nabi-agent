apiVersion: apps/v1
kind: Deployment
metadata:
  name: nabi-smtp-test
  labels:
    app: nabi-smtp-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nabi-smtp-test
  template:
    metadata:
      labels:
        app: nabi-smtp-test
    spec:
      containers:
        - name: mailpit
          image: axllent/mailpit:v1.21
          ports:
            - name: smtp
              containerPort: 1025
              protocol: TCP
            - name: web
              containerPort: 8025
              protocol: TCP
          env:
            - name: MP_SMTP_BIND_ADDR
              value: "0.0.0.0:1025"
            - name: MP_UI_BIND_ADDR
              value: "0.0.0.0:8025"
            - name: MP_MAX_MESSAGES
              value: "500"
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: web
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /livez
              port: web
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: nabi-smtp-test
  labels:
    app: nabi-smtp-test
spec:
  type: ClusterIP
  selector:
    app: nabi-smtp-test
  ports:
    - name: smtp
      port: 1025
      targetPort: smtp
      protocol: TCP
    - name: web
      port: 8025
      targetPort: web
      protocol: TCP
